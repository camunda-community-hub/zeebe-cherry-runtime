cherry:
  connectorslib:
    uploadpath: ./localstorage/upload
    classloaderpath: ./localstorage/classloader
    forcerefresh: true

  initialisation:
    runners:
      - https://github.com/camunda-community-hub/camunda-8-connector-pdf/releases/download/3.1.1/pdf-function-3.1.1.jar
      - https://github.com/camunda-community-hub/camunda-8-connector-zip/releases/download/1.0.0/ZIP-1.0.0.jar

  github:
    # Optional GitHub personal access token to avoid API rate limiting (60 req/h unauthenticated → 5000 req/h authenticated)
    # Generate at https://github.com/settings/tokens (no scopes needed for public repos)
    token: ""

  store:
    stores:
      - https://github.com/pierre-yves-monnet
    download:
      - https://github.com/camunda-community-hub/camunda-8-connector-zip/releases/download/1.0.0/ZIP-1.0.0.jar
      - pdf-function
    startup:
      startConnectorRuntime: true
      startCommunityConnector: true


  runners:
    # the runtime load all embedded runners
    embeddedrunner: true

    # the runtime load ping runners
    pingrunner: false


  tenants:
    # Enable the tenants functionality "autoDectection" implie to connect to Operate
    automaticDetection: true
    refreshTenantsInMinutes: 1
    tenants-ids:


# Visit https://github.com/camunda-community-hub/spring-zeebe/?tab=readme-ov-file#connect-to-zeebe

# -------------------- Self Manage
camunda:
  client:
    mode: self-managed
    auth:
      method: basic
      username: "demo"
      password: "demo"

    worker:
      defaults:
        max-jobs-active: 50
    grpc-address: http://localhost:26500
    rest-address: http://localhost:8080
    execution-thread: 50

  tasklist:
    enabled: false

  connector:
    inbound:
      enabled: false

operate:
  client:
    profile: simple
    enabled: true
    base-url: http://localhost:8081
    session-timeout: PT10M
    username: demo
    password: demo
# -------------------- Self Manage Identity
camundaOidc:
  client:
    mode: selfmanaged
    auth:
      clientId: zeebe
      clientSecret: AnDBsKoVjI

    zeebe:
      enabled: true
      gatewayUrl: http://localhost:26500
      preferRestOverGrpc: false
      audience: zeebe-api

operateOidc:
  client:
    profile: oidc
    enabled: true
    base-url: http://localhost:8081
    auth-url: http://localhost:18080/auth/realms/camunda-platform/protocol/openid-connect/token
    audience: operate-api
    client-id: operate
    client-secret: FK05vxEU8D

# -------------------- SAAS
camundaSaas:
  client:
    mode: saas
    auth:
      clientId: Lu.lVob..
      clientSecret: aoO.....
    clusterId: b16d70..
    region: jfk-1


server:
  port: 9081


spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  main:
    allow-bean-definition-overriding: true


logging:
  level:
    root: INFO
    org:
      springframework:
        boot:
          context:
            properties=TRACE:


# return message with BAD_REQUEST to the client
server.error.include-message: always

# Spring Boot Configuration
spring.application.name: CherryRuntime

# Cherry will override the zeebeClient bean

# --------------------- H2 - default
spring.datasource:
  url: "jdbc:h2:file:./cherry.db"
  driver-class-name: "org.h2.Driver"
  username: "sa"
  password: "password"
spring.jpa.database-platform: "org.hibernate.dialect.H2Dialect"
org.hibernate.dialect: "H2Dialect"


# --------------------- Postgres
postgres.spring.datasource:
  url: "jdbc:postgresql://localhost/cherrydb"
  username: "camunda"
  password: "camunda"
  driverClassName: "org.postgresql.Driver"
postgres.spring.jpa.database-platform: "org.hibernate.dialect.PostgreSQL94Dialect"

postgres.org.hibernate.dialect: "PostgreSQL94Dialect"



# allow CLOB in Postgres
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation: true




spring.jpa:
  generate-ddl: true
  hibernate.ddl-auto: "update"

  properties:
    hibernate:
      format_sql: true
      show-sql: true


