cherry:
  runner:
    refreshTopicsInMinutes: 5

  connectorslib:
    uploadpath: ./localstorage/upload
    classloaderpath: ./localstorage/classloader
    forcerefresh: true

  store:
    # Startup downloads for connectors: each entry is a direct JAR URL, downloaded using the
    # named store's own credentials (store must be a name known to StoreFactory, e.g. a
    # privateStore entry's "name").
    downloadStartup:

    privateStore:
      access: false
      listStores:
        - name: ""
          url: ""
          github:
            token: ""
            apikey: ""
          tokenHeaderName: "Authorization"
          tokenPrefix: "Bearer "
          apikeyHeaderName: ""
          startup:
            # NEVER, ALWAYS, UPDATE,FIXEDVERSION
            downloadPolicy: NEVER
            filter:

    # Is that possible to access this store?
    camundaConnector:
      access: true
      # Camunda connector are available https://github.com/camunda/connectors/tree/main/connectors
      # To be able to download, the store must be accessible (store.camundaConnector.access = true)
      # The JAR itself always comes from Maven Central (public, no token needed) - this GitHub
      # token is optional and only raises the API rate limit (60 req/h unauthenticated -> 5000
      # req/h authenticated). A plain personal access token from any GitHub account works.
      github:
        token: ""
      maven:
        token: ""
        apikey: ""
      startup:
        # NEVER, ALWAYS, UPDATE,FIXEDVERSION
        downloadPolicy: NEVER
        filter:

    # Is that possible to access this store?
    communityConnector:
      access: true
      filterProject:
      # -- Access to Github to discover project, access release and download from release
      # Optional GitHub token to avoid API rate limiting (60 req/h unauthenticated -> 5000 req/h
      # authenticated) - this store lists every repository under the org, so it benefits the most.
      # Generate at https://github.com/settings/tokens (no scopes needed for public repos)
      github:
        token: ""

      # -- Access to Maven Central to download artifacts
      maven:
        access: false
        token: ""
        apikey: ""
      # -- Access to JFrog Artifactory to download artifacts
      # Credentials for Camunda's JFrog Artifactory (artifacts.camunda.com) - see the "connectors" repo,
      # gated behind Camunda SSO. Generate either one from your JFrog user profile (top-right avatar ->
      # Edit Profile): an Identity Token (sent as "Authorization: Bearer <token>") or an API Key
      # (sent as "X-JFrog-Art-Api: <apikey>"). Only one is needed.
      jfrog:
        access: false
        token: ""
        apikey: ""
      startup:
        # NEVER, ALWAYS, UPDATE,FIXEDVERSION
        downloadPolicy: NEVER
        filter:

    # Is that possible to access this store?
    marketplaceConnector:
      access: true
      github:
        token: ""
      maven:
        token: ""
        apikey: ""

  database:
    purgeRetentionDays: 30

  tenants:
    # Enable the tenants functionality "autoDectection" implie to connect to Operate
    automaticDetection: true
    refreshTenantsInMinutes: 1
    tenants-ids:


# Visit https://github.com/camunda-community-hub/spring-zeebe/?tab=readme-ov-file#connect-to-zeebe

# -------------------- Self Manage
camunda:
  client:
    mode: self-managed
    auth:
      method: basic
      username: "demo"
      password: "demo"

    worker:
      defaults:
        max-jobs-active: 50
    grpc-address: http://localhost:26500
    rest-address: http://localhost:8080
    execution-thread: 50

  tasklist:
    enabled: false

  connector:
    inbound:
      enabled: false

operate:
  client:
    profile: simple
    enabled: true
    base-url: http://localhost:8081
    session-timeout: PT10M
    username: demo
    password: demo
# -------------------- Self Manage Identity
camundaOidc:
  client:
    mode: selfmanaged
    auth:
      clientId: zeebe
      clientSecret: AnDBsKoVjI

    zeebe:
      enabled: true
      gatewayUrl: http://localhost:26500
      preferRestOverGrpc: false
      audience: zeebe-api

operateOidc:
  client:
    profile: oidc
    enabled: true
    base-url: http://localhost:8081
    auth-url: http://localhost:18080/auth/realms/camunda-platform/protocol/openid-connect/token
    audience: operate-api
    client-id: operate
    client-secret: FK05vxEU8D

# -------------------- SAAS
camundaSaas:
  client:
    mode: saas
    auth:
      clientId: Lu.lVob..
      clientSecret: aoO.....
    clusterId: b16d70..
    region: jfk-1


server:
  port: 9081


spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  main:
    allow-bean-definition-overriding: true


logging:
  level:
    root: INFO
    org:
      springframework:
        boot:
          context:
            properties=TRACE:


# return message with BAD_REQUEST to the client
server.error.include-message: always

# Spring Boot Configuration
spring.application.name: CherryRuntime

# Cherry will override the zeebeClient bean

# --------------------- H2 - default
spring.datasource:
  url: "jdbc:h2:file:./cherry.db"
  driver-class-name: "org.h2.Driver"
  username: "sa"
  password: "password"
spring.jpa.database-platform: "org.hibernate.dialect.H2Dialect"
org.hibernate.dialect: "H2Dialect"


# --------------------- Postgres
postgres.spring.datasource:
  url: "jdbc:postgresql://localhost/cherrydb"
  username: "camunda"
  password: "camunda"
  driverClassName: "org.postgresql.Driver"
postgres.spring.jpa.database-platform: "org.hibernate.dialect.PostgreSQL94Dialect"

postgres.org.hibernate.dialect: "PostgreSQL94Dialect"



# allow CLOB in Postgres
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation: true




spring.jpa:
  generate-ddl: true
  hibernate.ddl-auto: "update"

  properties:
    hibernate:
      format_sql: true
      show-sql: true


